name: Build & Lint Checks

# `main` and `dev` are the two branches the model in AGENTS.md says receive PRs, and for
# a long time they were the only two listed here. That left long-lived integration
# branches — the ones a release's worth of work is assembled on before it reaches `dev` —
# taking PRs with no checks at all. `feature/column-view-v4` took 390 commits that way;
# merged PR #409 into it has `check-runs=0`. Nothing in the PR UI says a branch is
# unchecked, so the gap is invisible from exactly the place you would look for it.
#
# `feature/**` matches on the PR's *base* branch, so this covers PRs into any such branch
# without depending on what the head branch is called. Note the residual case: an
# integration branch named outside that prefix is still unchecked, and if one is ever
# created the fix is to add it here, or to drop the filter entirely — under the branch
# model this list can only ever exclude PRs that should have been checked.
on:
  pull_request:
    branches:
      - main
      - dev
      - 'feature/**'
  # A long-lived integration branch is not always the head of an open PR. While v5 was
  # assembled on `feature/grid-view-v5`, its own PR had been merged and the next one could
  # not be opened yet — `dev` was holding an unreleased v4.2, so pointing anything at it,
  # even a draft, was the wrong signal. That left every push to the branch carrying the
  # release completely unchecked, which is the blind spot described above arriving from the
  # other direction: there is no PR for the PR UI to under-report.
  #
  # Pushes to `main` and `dev` are deliberately not listed. Both are reached only through a
  # PR that this workflow already gates, so adding them would re-run the same commit rather
  # than cover anything new.
  push:
    branches:
      - 'feature/**'

# Read-only, and stated rather than inherited. The repository's default token is
# read-write, so without this block every step here could push to the repository —
# while nothing in these jobs uses the token for anything but the checkout and the
# artifacts the test jobs hand to `lint-build`.
permissions:
  contents: read

# A newer push to the same pull request or branch makes a run still going moot, so it is
# canceled rather than left holding runners: each run takes six jobs now, and the account's
# plan runs twenty at once across every session pushing. The tip is what gets checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Three jobs where there was one. Every gate used to run in a single job, `lint-build`, and
# `npm test` was most of it: about 950 s of a 1,070 s job on a quiet runner and up to 1,400 s
# on a busy one, because one runner's three workers worked through 2,260 s of test files one
# after another. Now the gates run beside four test jobs that split the suite between them,
# and `lint-build` waits for all of them.
#
# `lint-build` keeps its name because `main`'s ruleset requires a status check of exactly that
# name from GitHub Actions; renaming it would leave the release PR waiting on a check no job
# reports. It must also fail rather than skip: GitHub counts a required job that was skipped
# as passing, so it runs `if: always()` and fails on any part that did not succeed.
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Read the Node version from .nvmrc so CI runs the same runtime as the
      # Cloudflare Workers build that publishes the docs site. They diverged once —
      # CI on Node 24 (npm 11) and the deploy on Node 22 (npm 10) — and npm 11
      # silently tolerated a package-lock.json that npm 10 rejects outright. CI went
      # green, the deploy died in `npm ci`, and the docs site served stale content
      # with nothing in the PR to suggest anything was wrong. Pinning both to one
      # file is what makes a green CI run mean the site will actually publish.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Two release-infra drifts that every other check is blind to, guarded before the
      # install so they fail in seconds. `npm ci` validates dependencies but never the root
      # version, and exits 0 when package.json and package-lock.json disagree — so a release
      # that bumps package.json alone passes lint, tsc, the tests and the build (8 of the 10
      # releases from v3.0.1 through v3.4.0 shipped with a stale lock version that way, and
      # 31 of 37 tags overall). And CI pins Node from .nvmrc while the Cloudflare build image
      # reads .node-version: two files that must
      # agree for the pin above to mean anything. When they drift, CI and the deploy run
      # different npm majors and the #404 failure returns invisibly — CI green, docs site
      # stale, the only log in the Cloudflare dashboard.
      - name: Check version and Node pinning consistency
        run: |
          PKG=$(node -p "require('./package.json').version")
          LOCK=$(node -p "require('./package-lock.json').version")
          LOCK_ROOT=$(node -p "require('./package-lock.json').packages[''].version")
          if [ "$PKG" != "$LOCK" ] || [ "$PKG" != "$LOCK_ROOT" ]; then
            echo "::error::Version drift — package.json=$PKG, package-lock.json=$LOCK, packages['']=$LOCK_ROOT. Fix with: npx npm@11 install --package-lock-only"
            exit 1
          fi
          NVMRC=$(tr -d ' \r\n' < .nvmrc)
          NODEVER=$(tr -d ' \r\n' < .node-version)
          if [ "$NVMRC" != "$NODEVER" ]; then
            echo "::error::.nvmrc ($NVMRC) and .node-version ($NODEVER) disagree. CI pins from .nvmrc, the Cloudflare build image reads .node-version; drift between them reintroduces the #404 npm-version mismatch."
            exit 1
          fi
          # The two pin files agreeing is only worth something if every workflow actually
          # reads them. release.yml hardcoded `node-version: 24` against a .nvmrc of 22 and
          # nothing noticed, because the check above compares the files to each other and
          # never to the workflows — so the job that runs `npm ci` and publishes the release
          # was the one job on an untested npm major.
          HARDCODED=$(grep -rlE '^[[:space:]]*node-version:' .github/workflows/ || true)
          if [ -n "$HARDCODED" ]; then
            echo "::error::Workflow(s) hardcode a Node version instead of node-version-file: .nvmrc — $HARDCODED. Pin from .nvmrc so every job runs the npm major the lockfile is maintained under."
            exit 1
          fi
          echo "Consistent: v$PKG on Node $NVMRC"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run lint` runs eslint with `--fix`, and `prettier/prettier` is a fixable
      # error rule — so a misformatted file is silently rewritten in the CI checkout and
      # the step exits 0. Formatting has therefore never been gated, and eslint covers
      # only `src/`, `tests/` and `scripts/` anyway: markdown, YAML and JSON were outside
      # every check. Ten docs files had drifted, including the README and the release
      # notes. This is the same failure that hit `scripts/` before v4 pulled it in.
      - name: Check formatting
        run: npm run check:format

      # AGENTS.md prescribes tsc --noEmit as a validation step, but it was never
      # enforced in CI. Rollup strips types without checking them, so a type error
      # could build and ship cleanly.
      - name: Type check
        run: npx tsc --noEmit

      # Adding a language touches four places and three of them fail silently: a missing
      # top-level key renders as a raw key name, a partially translated `editor` section
      # defeats the whole-language English fallback, and a missing supportedLocales entry in
      # dayjs.ts quietly drops relative times back to English. Catalan and Romanian shipped
      # with that last one for months. Nothing in lint, tsc or the build can see any of it.
      - name: Check i18n integrity
        run: npm run check:i18n

      # The docs are a separate VitePress site with nothing tying them to the code, so
      # every way they rot is silent: the site builds, the card works, and the page lies.
      # Nine documented defaults were wrong at once (day_spacing said 5px against a real
      # 10px, remove_location_country had the boolean inverted), whole nested interfaces
      # were collapsed to `object` so several options were reachable only by reading the
      # source, and a stray `entities:` line outside a ```yaml fence silently broke an
      # example. vitepress build is happy with all of it.
      - name: Check docs integrity
        run: npm run check:docs

      # The converse of the step above, and the reason both exist. check:docs reads the
      # markdown; this compiles the site the way Cloudflare does. Neither subsumes the
      # other: a link to a heading that does not exist is caught here by check:docs and
      # sails through vitepress build, while a broken docs/.vitepress/config.mts is
      # invisible to check:docs, to lint, and to tsc --noEmit — docs/ is outside the
      # tsconfig include — and fails only the real build.
      #
      # That gap mattered because the site deploys on push to main and nowhere else, so
      # no pull request ever ran this command. A config error would pass every check
      # here, merge, fail the Cloudflare build, and leave the site quietly serving the
      # previous version — the same silent-stale-docs failure recorded in AGENTS.md for
      # the npm-major drift, which the .nvmrc pinning check above now guards. Running
      # the deploy's own build command is the strongest form of that guarantee, and it
      # costs about two seconds.
      - name: Build docs site
        run: npm run docs:build

      - name: Build
        run: npm run build

      # The card ships as two self-contained files, and every way that can go wrong is
      # silent at build time and fatal in a browser. Two matter most. HACS appends
      # ?hacstag= to the registered resource and relative specifiers resolve with the
      # query dropped, so a file importing the card back makes the browser evaluate the
      # whole card twice — "NotSupportedError: the name has already been used with this
      # registry", dead editor. Separate builds prevent it; merging them back into one
      # with code-splitting brings it straight back, which is why this is a check and not
      # a comment: a comment in rollup.config.mjs would not stop anyone merging the builds
      # back. And esbuild's target: 'es2017' lowers import.meta to `{}` unless
      # told otherwise, which leaves the editor unloadable while typecheck, lint, tests
      # and the build itself all pass.
      #
      # Also carries the sourcemap assertions this step used to hold inline (#315, #358):
      # same rule, that we never ship a reference to a file we do not publish.
      - name: Verify bundle integrity
        run: npm run check:bundle

  # The card renders a red error box rather than degrading when setConfig throws, and the
  # surrounding logic normalizes untyped YAML — so a value that merely coerces oddly (an
  # editor-cleared field persisting as '', a bare `-` parsing as null) reaches a comparison
  # and silently suppresses events, days, or the whole card. Neither tsc nor the build can see
  # past the type boundary at setConfig.
  #
  # Each job runs `npm test` on its share of the suite. `scripts/vitest-sequencer.mjs` deals
  # the files out by what each costs, so the four finish together, and every job deals the
  # same way, so between them they run each file once. A larger runner would not buy this:
  # larger GitHub-hosted runners need a Team or Enterprise plan and are billed by the minute
  # even for a public repository, and a self-hosted one would run pull requests from forks on
  # a machine of our own. Four standard runners are free here and run side by side.
  test:
    runs-on: ubuntu-latest
    strategy:
      # Every share runs to its end, so one failing file does not hide the others' failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vitest takes one worker per core but one, leaving a core for its own process, which
      # mostly waits; on a standard runner that left one of four cores idle. CI is outside
      # `scripts/vitest-limits.mjs`, so the count is set here.
      - name: Use every core
        run: |
          echo "VITEST_MAX_WORKERS=$(nproc)" >> "$GITHUB_ENV"
          echo "$(nproc) cores, $(free -g | awk '/^Mem:/ { print $2 }') GiB"

      - name: Test
        run: npm test
        env:
          VITEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          VITEST_REPORT: shard/report.json

      # The whole suite, unsharded, for `lint-build` to check the jobs' reports against. It
      # lists files without running them, in under a second.
      - name: List the suite
        if: always()
        run: ./node_modules/.bin/vitest list --filesOnly --json=shard/files.json

      - name: Upload what this share ran
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.shard }}
          path: shard/
          retention-days: 7

  lint-build:
    if: always()
    needs: [gates, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download what each share ran
        uses: actions/download-artifact@v8
        with:
          pattern: shard-*
          path: shards

      # A test job left out of the matrix, or a deal that dropped a file, would leave files
      # run nowhere while every job that did run is green. This checks that the jobs ran each
      # file exactly as often as the suite holds it, and writes what each took to the run's
      # summary, the costliest files among it.
      - name: Check the shares add up to the suite
        run: node scripts/check-shards.mjs shards

      - name: Require every job
        if: always()
        env:
          GATES: ${{ needs.gates.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "gates: $GATES, test: $TEST"
          [ "$GATES" = success ] && [ "$TEST" = success ]
