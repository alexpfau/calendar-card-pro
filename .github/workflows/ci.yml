name: Build & Lint Checks

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Read the Node version from .nvmrc so CI runs the same runtime as the
      # Cloudflare Workers build that publishes the docs site. They diverged once —
      # CI on Node 24 (npm 11) and the deploy on Node 22 (npm 10) — and npm 11
      # silently tolerated a package-lock.json that npm 10 rejects outright. CI went
      # green, the deploy died in `npm ci`, and the docs site served stale content
      # with nothing in the PR to suggest anything was wrong. Pinning both to one
      # file is what makes a green CI run mean the site will actually publish.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # AGENTS.md prescribes tsc --noEmit as a validation step, but it was never
      # enforced in CI. Rollup strips types without checking them, so a type error
      # could build and ship cleanly.
      - name: Type check
        run: npx tsc --noEmit

      # Adding a language touches four places and three of them fail silently: a missing
      # top-level key renders as a raw key name, a partially translated `editor` section
      # defeats the whole-language English fallback, and a missing supportedLocales entry in
      # dayjs.ts quietly drops relative times back to English. Catalan and Romanian shipped
      # with that last one for months. Nothing in lint, tsc or the build can see any of it.
      - name: Check i18n integrity
        run: npm run check:i18n

      # The card renders a red error box rather than degrading when setConfig throws,
      # and the surrounding logic normalizes untyped YAML — so a value that merely
      # coerces oddly (an editor-cleared field persisting as '', a bare `-` parsing as
      # null) reaches a comparison and silently suppresses events, days, or the whole
      # card. Neither tsc nor the build can see past the type boundary at setConfig.
      # Runs before the build: a failing assertion is faster to read than a bundle.
      - name: Test
        run: npm test

      # The docs are a separate VitePress site with nothing tying them to the code, so
      # every way they rot is silent: the site builds, the card works, and the page lies.
      # Nine documented defaults were wrong at once (day_spacing said 5px against a real
      # 10px, remove_location_country had the boolean inverted), whole nested interfaces
      # were collapsed to `object` so several options were reachable only by reading the
      # source, and a stray `entities:` line outside a ```yaml fence silently broke an
      # example. vitepress build is happy with all of it.
      - name: Check docs integrity
        run: npm run check:docs

      - name: Build
        run: npm run build

      # The card ships as a facade plus content-hashed chunks, and every way that can go
      # wrong is silent at build time and fatal in a browser. The one that matters most:
      # HACS appends ?hacstag= to the registered resource, relative specifiers resolve
      # with the query dropped, so a chunk importing back from the entry makes the
      # browser evaluate the whole card twice — "NotSupportedError: the name has already
      # been used with this registry", dead editor. The first experimental split produced
      # exactly that. The reference card that hit it first documented it as a comment in
      # its Rollup config, which is why this is a check.
      #
      # Also carries the sourcemap assertions this step used to hold inline (#315, #358):
      # same rule, that we never ship a reference to a file we do not publish.
      - name: Verify bundle integrity
        run: npm run check:bundle
