name: Build & Lint Checks

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # AGENTS.md prescribes tsc --noEmit as a validation step, but it was never
      # enforced in CI. Rollup strips types without checking them, so a type error
      # could build and ship cleanly.
      - name: Type check
        run: npx tsc --noEmit

      # Adding a language touches four places and three of them fail silently: a missing
      # top-level key renders as a raw key name, a partially translated `editor` section
      # defeats the whole-language English fallback, and a missing supportedLocales entry in
      # dayjs.ts quietly drops relative times back to English. Catalan and Romanian shipped
      # with that last one for months. Nothing in lint, tsc or the build can see any of it.
      - name: Check i18n integrity
        run: npm run check:i18n

      # The card renders a red error box rather than degrading when setConfig throws,
      # and the surrounding logic normalizes untyped YAML — so a value that merely
      # coerces oddly (an editor-cleared field persisting as '', a bare `-` parsing as
      # null) reaches a comparison and silently suppresses events, days, or the whole
      # card. Neither tsc nor the build can see past the type boundary at setConfig.
      # Runs before the build: a failing assertion is faster to read than a bundle.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # A sourceMappingURL comment in the bundle points at a .map that is never shipped
      # (release.yml attaches only the .js, hacs.json pins that one filename), so every
      # user's browser resolves it to a 404. This shipped for several releases before
      # anyone traced it (#315, #358); the check is cheap, the symptom is silent.
      - name: Verify no sourcemap references in bundle
        run: |
          if grep -q 'sourceMappingURL' dist/calendar-card-pro.js; then
            echo "::error::dist/calendar-card-pro.js contains a sourceMappingURL comment. The .map file is not distributed, so this 404s in every user's browser. Check output.sourcemap in rollup.config.mjs."
            exit 1
          fi
          if compgen -G 'dist/*.map' > /dev/null; then
            echo "::error::Build emitted a sourcemap into dist/. Sourcemaps are not distributed; check output.sourcemap in rollup.config.mjs."
            exit 1
          fi
          echo "Bundle is free of sourcemap references."
