name: Build & Lint Checks

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # AGENTS.md prescribes tsc --noEmit as a validation step, but it was never
      # enforced in CI. Rollup strips types without checking them, so a type error
      # could build and ship cleanly.
      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
