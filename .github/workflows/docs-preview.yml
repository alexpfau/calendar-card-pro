name: Docs Preview

# Publishes the documentation site, built from any ref, to a second Cloudflare Worker on its
# own hostname, so unreleased docs can be shared before the release PR deploys them. Manual
# only: nothing here runs on push, so it spends no Workers Builds minutes, and the production
# Worker (`calendar-card-pro`, built by Workers Builds on every push to `main`) is never
# touched. See AGENTS.md, Docs site deployment.
#
# GitHub offers "Run workflow" only for a workflow file on the default branch, which is why
# this file reached `main` ahead of the release that carries everything else from `dev`.
#
# Run it from the Actions tab, or: gh workflow run docs-preview.yml -f ref=dev
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        default: dev

# The token is used for the checkout and nothing else. Deploying authenticates with the
# Cloudflare token from the environment below, never with GITHUB_TOKEN.
permissions:
  contents: read

# Runs queue instead of overlapping, so the one dispatched last is what the preview shows.
concurrency:
  group: docs-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Cloudflare secrets live on this environment, so no other workflow can read them.
    environment:
      name: docs-preview
      url: https://dev.calendar-card-pro.alexpfau.com
    env:
      PREVIEW_WORKER: calendar-card-pro-preview
      PREVIEW_HOST: dev.calendar-card-pro.alexpfau.com
      PRODUCTION_HOST: calendar-card-pro.alexpfau.com
      # Pinned exactly so every run is reproducible. Dependabot cannot see this string, so it
      # is bumped by hand.
      WRANGLER_VERSION: 4.151.1
      # The input reaches shell only through this variable, never through an expression
      # inside `run:`, so a ref name cannot inject a command.
      REF: ${{ inputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # The build runs third-party install scripts in a job that later holds a deploy
          # token, so the checkout token is not left behind in .git/config for them.
          persist-credentials: false

      # Same pin as ci.yml and the Cloudflare build image. ci.yml fails any workflow that
      # hardcodes a Node version instead.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # DOCS_PREVIEW labels the site "(Preview)" and adds a robots meta tag, through
      # docs/.vitepress/config.mts on refs that carry that change. Inert everywhere else.
      - name: Build docs site
        run: npm run docs:build
        env:
          DOCS_PREVIEW: '1'

      # Both edits touch only this run's build output. Workers static assets parse
      # `_headers` and never serve it. The rewrite keeps the release notes' absolute links on
      # the preview instead of sending readers to the released docs, where pages that are
      # new on this ref do not exist yet.
      - name: Mark the build as a preview
        working-directory: docs/.vitepress/dist
        run: |
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > _headers
          # Single quotes on purpose: perl expands $ENV{...}, and \Q...\E escapes the dots.
          # shellcheck disable=SC2016
          { grep -rlF --null "https://$PRODUCTION_HOST" . || true; } \
            | xargs -0 -r perl -pi -e 's#https://\Q$ENV{PRODUCTION_HOST}\E#https://$ENV{PREVIEW_HOST}#g'
          if grep -rqF "https://$PRODUCTION_HOST" .; then
            echo "::error::Links to https://$PRODUCTION_HOST survived the rewrite."
            exit 1
          fi

      # Derived from the production config of the ref being built, so the asset settings
      # cannot drift, with only the name and the hostname replaced. Refuses to write a config
      # that would land on the production Worker or hostname. Never deploy a preview with
      # `--name` or an `env` block instead: `routes` is inheritable, so both would carry the
      # production custom domain with them.
      - name: Write the preview Worker config
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const prod = JSON.parse(readFileSync("wrangler.jsonc", "utf8").replace(/^\s*\/\/.*$/gm, ""));
            const { PREVIEW_WORKER: name, PREVIEW_HOST: host } = process.env;
            const prodHosts = (prod.routes ?? []).map((r) => r.pattern);
            if (!name || name === prod.name || !host || prodHosts.includes(host)) {
              console.error("::error::Preview config would collide with production.");
              process.exit(1);
            }
            const preview = {
              ...prod,
              name,
              workers_dev: false,
              preview_urls: false,
              routes: [{ pattern: host, custom_domain: true }],
            };
            writeFileSync("wrangler.preview.json", JSON.stringify(preview, null, 2));
          '

      - name: Deploy
        run: >-
          npx --yes "wrangler@$WRANGLER_VERSION" deploy
          --config wrangler.preview.json
          --message "docs preview: $REF @ $(git rev-parse --short HEAD)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        run: echo "Published \`$REF\` @ $(git rev-parse --short HEAD) to https://$PREVIEW_HOST" >> "$GITHUB_STEP_SUMMARY"
