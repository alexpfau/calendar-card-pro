name: HACS Validation

# Runs on PRs as well as on `main`, because everything HACS validates is decided before a
# merge and not after it. `hacs.json`, the repository description and topics, the release
# assets' names — a mistake in any of them is a failed install for every user, and until
# this ran pre-merge it could only be discovered once `main` already carried it. The
# two-file split is the case that made this concrete: which files a release ships is now a
# thing a PR can get wrong.
#
# The branch list mirrors ci.yml, for the reason documented there.
#
# A branch whose name ends in `tags` fails this workflow for a reason that has nothing to do
# with the repository. HACS reads `hacs.json` and the README over the network from
# raw.githubusercontent.com/{repo}/{ref}/{file}, and hacs/integration's base.py strips
# `tags/` out of that URL unconditionally, to normalize release refs like `tags/v1.2.3`. The
# fetch then 404s and both content checks report generic "invalid hacs.json" / "no images in
# Readme" errors while the six metadata checks pass. Rename the branch — see AGENTS.md,
# "Branch model".
#
# A GitHub incident produces the same shape, and that is the trap: those two content checks
# are the only ones that need a network fetch, so anything degrading raw.githubusercontent.com
# fails exactly what the branch-name bug fails. On 2026-08-17 — "archive downloads and raw
# repository content downloads … approximate 50% error rate" — this workflow reported
# "Repository structure for <branch> is not compliant" on a pull request touching only `src/`,
# `tests/` and `docs/development/`, none of which HACS reads.
#
# **Settle it by running this workflow against `main`**, not by re-running the failed job:
#
#     gh workflow run hacs-validate.yml --ref main
#
# `main` is the ref HACS actually ships from, so it cannot be structurally non-compliant. If it
# reports the same thing, the problem is not your branch. During that incident it did — "…for
# refs/heads/main is not compliant" — which settled the question in one run.
#
# Retrying is the obvious move and it is not good enough: at a 50% error rate two consecutive
# failures are a one-in-four coincidence, and this job failed **three times running** on one
# unchanged commit that afternoon before the `main` control was tried. So "it failed twice, it
# must be real" is worth nothing here. Renaming a branch is the expensive wrong move, because it
# appears to work — the next run passes on its own and the rename takes the credit.
on:
  pull_request:
    branches:
      - main
      - dev
      - 'feature/**'
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch:
    inputs:
      pull_request:
        description: >-
          Validate this pull request's head the way a pull request from a fork is validated.
          Leave empty to validate the branch the workflow runs on.
        required: false
        type: string

# Read-only, for the reason given in ci.yml. hacs/action declares a `comment` input that
# defaults to true, which reads as though it posts to the PR — but `action/action.py` in
# hacs/integration never reads it, and only fetches repository data. If HACS ever starts
# commenting, this job will need `pull-requests: write` as well.
permissions:
  contents: read

jobs:
  validate-hacs:
    if: github.repository == 'alexpfau/calendar-card-pro'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Branches of this repository: pull requests from them, pushes to `main`, the schedule,
      # and a manual run with no pull request number.
      - name: HACS validation
        if: >-
          ${{ !inputs.pull_request && !(github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository) }}
        uses: hacs/action@main
        with:
          category: 'plugin'

      # A pull request from a fork. hacs/action validates the pull request's *head
      # repository*, and a fork has no releases: HACS then looks for `calendar-card-pro.js`
      # in the fork's tree, finds no committed `dist/`, and reports "Repository structure for
      # <branch> is not compliant" on every outside contribution, whatever it changed. So
      # validate this repository instead, at the pull request's head commit, which GitHub
      # serves as `refs/pull/<n>/head` through both the API and raw.githubusercontent.com:
      # the fork's `hacs.json` and README are checked, against this repository's releases.
      #
      # A step of its own rather than a conditional `env:` on the step above, because
      # action.py reads `REPOSITORY_REF` with `os.getenv` and would take an empty string as
      # a ref rather than as absent. `repository` is what makes it skip the pull request
      # event's head repository, and `REPOSITORY_REF` overrides the default branch it would
      # otherwise check out.
      #
      # `workflow_dispatch` with `pull_request` set runs this path on demand, which is the
      # only way to exercise it without a fork:
      #
      #     gh workflow run hacs-validate.yml --ref <branch> -f pull_request=<n>
      - name: HACS validation (pull request from a fork)
        if: >-
          ${{ inputs.pull_request || (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository) }}
        uses: hacs/action@main
        env:
          REPOSITORY_REF: refs/pull/${{ github.event.pull_request.number || inputs.pull_request }}/head
        with:
          category: 'plugin'
          repository: ${{ github.repository }}
