name: HACS Validation

# Runs on PRs as well as on `main`, because everything HACS validates is decided before a
# merge and not after it. `hacs.json`, the repository description and topics, the release
# assets' names — a mistake in any of them is a failed install for every user, and until
# this ran pre-merge it could only be discovered once `main` already carried it. The
# two-file split is the case that made this concrete: which files a release ships is now a
# thing a PR can get wrong.
#
# The branch list mirrors ci.yml, for the reason documented there.
#
# A branch whose name ends in `tags` fails this workflow for a reason that has nothing to do
# with the repository. HACS reads `hacs.json` and the README over the network from
# raw.githubusercontent.com/{repo}/{ref}/{file}, and hacs/integration's base.py strips
# `tags/` out of that URL unconditionally, to normalise release refs like `tags/v1.2.3`. The
# fetch then 404s and both content checks report generic "invalid hacs.json" / "no images in
# Readme" errors while the six metadata checks pass. Rename the branch — see AGENTS.md,
# "Branch model".
on:
  pull_request:
    branches:
      - main
      - dev
      - 'feature/**'
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch:

jobs:
  validate-hacs:
    if: github.repository == 'alexpfau/calendar-card-pro'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: 'plugin'
