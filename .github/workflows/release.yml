name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A tag that disagrees with package.json ships a bundle whose embedded version
      # string does not match the release it is attached to. Cheap to check, painful
      # to discover after publishing.
      - name: Verify tag matches package.json
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}."
            exit 1
          fi
          echo "Version check passed: ${PKG_VERSION}"

      # Fail before building if the curated notes are missing, so the problem surfaces
      # in seconds rather than after a full lint + build cycle.
      - name: Extract release notes
        run: |
          node scripts/extract-release-notes.mjs "${GITHUB_REF_NAME}" > release-body.md
          echo "Release body: $(wc -l < release-body.md) lines"

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # The release is the only thing users ever download, and this is the build that
      # produces it — so the multi-file assertions run here too, not only on pull
      # requests. A file importing another, a card that names the wrong editor, an
      # `import.meta` lowered to `{}` by esbuild, or a stale file left over from an
      # earlier build would otherwise be published and then downloaded by every user.
      - name: Verify bundle integrity
        run: npm run check:bundle

      # For people who install by copying files rather than through HACS. The card is not
      # a single file — it is the card plus a separate editor, and the card fetches the
      # editor by URL when someone opens it — so copying just the .js named in hacs.json
      # yields a card that renders but cannot be configured. The zip is flat, matching the
      # layout HACS itself writes into <config>/www/community/calendar-card-pro/.
      #
      # HACS downloads it like any other asset but never registers it: `filename` in
      # hacs.json selects the Lovelace resource, and it names the .js.
      - name: Package dist for manual installation
        run: |
          cd dist && zip -q -j ../calendar-card-pro.zip *.js
          cd .. && unzip -l calendar-card-pro.zip

      # dist/*.js deliberately, not dist/* — the glob does not match *.js.map, so the
      # sourcemap decision (still off, see rollup.config.mjs) is unaffected by this. It
      # matches exactly two files, and `check:bundle` above has already asserted that.
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: release-body.md
          files: |
            dist/*.js
            calendar-card-pro.zip
