<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Calendar Card Pro">
  <defs>
    <!-- Sampled from .github/img/header.png: indigo (top-left) to rose (top-centre). -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2a6e" />
      <stop offset="0.55" stop-color="#6a2654" />
      <stop offset="1" stop-color="#8d3b51" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)" />

  <!-- Two event rows: Home Assistant blue accent bar + title + time. -->
  <g fill="#ffffff">
    <rect x="13" y="16" width="4" height="14" rx="2" fill="#03a9f4" />
    <rect x="23" y="16.5" width="28" height="5" rx="2.5" />
    <rect x="23" y="25" width="18" height="4" rx="2" opacity="0.62" />

    <rect x="13" y="34" width="4" height="14" rx="2" fill="#03a9f4" />
    <rect x="23" y="34.5" width="28" height="5" rx="2.5" />
    <rect x="23" y="43" width="18" height="4" rx="2" opacity="0.62" />
  </g>
</svg>
